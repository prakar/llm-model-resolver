# llm-model-resolver — active settings
# Edit this file in the GitHub repo to control which models are selected.
# Changes are version-controlled and apply everywhere this package is installed.

# flagship_performance: yes → newest, most capable models (profiles/flagship.yml)
#   xAI:        newest reasoning model (e.g. grok-4.7)
#   Anthropic:  newest non-haiku model (latest opus/sonnet tier)
#   Gemini:     newest pro-class model (flash and lite excluded)
#   Good for:   complex reasoning, high-stakes analysis, quality-critical work
#
# flagship_performance: no  → cheap models (profiles/economy.yml). This is the shipped default.
#   xAI:        cheapest model by live input price, preferring non-reasoning variants
#               (the exact pick depends on what your account lists: run `node inspect.js xai`)
#   Anthropic:  claude-haiku-4-5 ($1/$5 per M) from the maintained price table
#   Gemini:     gemini-flash ($0.075/$0.30 per M) from the maintained price table
#   Good for:   batch tagging, classification, structured extraction

flagship_performance: no
